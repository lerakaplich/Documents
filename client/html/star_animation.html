<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        html, body {
            background-color: #1B232A;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            background-color: #1B232A;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        const stars = [];
        const STAR_COUNT = 200;
        const MOUSE_RADIUS = 150;

        let mouseX = -1000;
        let mouseY = -1000;

        // Цвет подсветки
        const HIGHLIGHT_COLOR = '#ccab6e';

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.baseSize = this.size;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.phase = Math.random() * Math.PI * 2;
                this.color = this.getRandomColor();
                this.targetColor = this.color;
                this.currentColor = this.color;
            }

            getRandomColor() {
                const colors = [
                    '#ffffff', '#ffe9d4', '#d4f1ff',
                    '#ffd4d4', '#ffb3b3', '#b3d9ff'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 255, g: 255, b: 255 };
            }

            rgbToHex(r, g, b) {
                return '#' + [r, g, b].map(x => {
                    const hex = Math.round(x).toString(16);
                    return hex.length === 1 ? '0' + hex : hex;
                }).join('');
            }

            lerpColor(color1, color2, t) {
                const c1 = this.hexToRgb(color1);
                const c2 = this.hexToRgb(color2);
                const r = c1.r + (c2.r - c1.r) * t;
                const g = c1.g + (c2.g - c1.g) * t;
                const b = c1.b + (c2.b - c1.b) * t;
                return this.rgbToHex(r, g, b);
            }

            update(time) {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                this.opacity = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time / 1000 + this.phase));

                this.currentColor = this.lerpColor(this.currentColor, this.targetColor, 0.05);
            }

            draw(ctx, time) {
                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const isHovered = dist < MOUSE_RADIUS;

                let currentSize = this.baseSize;
                let color = this.currentColor;

                if (isHovered) {
                    const factor = 1 - dist / MOUSE_RADIUS;
                    currentSize = this.baseSize * (1 + factor * 2);

                    this.targetColor = HIGHLIGHT_COLOR;

                    // Свечение вокруг звезды
                    const glow = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, currentSize * 4
                    );
                    glow.addColorStop(0, `rgba(204, 171, 110, ${0.35 * factor})`);
                    glow.addColorStop(1, 'rgba(204, 171, 110, 0)');

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentSize * 4, 0, Math.PI * 2);
                    ctx.fillStyle = glow;
                    ctx.fill();
                } else {
                    this.targetColor = this.color;
                }

                // Рисуем звезду
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentSize, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();

                ctx.globalAlpha = 1;

                // Блик
                if (currentSize > 2) {
                    ctx.beginPath();
                    ctx.arc(this.x - currentSize * 0.3, this.y - currentSize * 0.3,
                           currentSize * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fill();
                }
            }
        }

        // Инициализация звезд
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        function drawLines(ctx) {
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const dx = stars[i].x - stars[j].x;
                    const dy = stars[i].y - stars[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 150) {
                        const d1 = Math.sqrt(
                            Math.pow(stars[i].x - mouseX, 2) +
                            Math.pow(stars[i].y - mouseY, 2)
                        );
                        const d2 = Math.sqrt(
                            Math.pow(stars[j].x - mouseX, 2) +
                            Math.pow(stars[j].y - mouseY, 2)
                        );

                        let opacity = 0.15 * (1 - dist / 150);
                        let color = `rgba(255, 255, 255, ${opacity})`;
                        let lineWidth = 1;

                        if (d1 < MOUSE_RADIUS || d2 < MOUSE_RADIUS) {
                            const factor = Math.max(
                                1 - d1 / MOUSE_RADIUS,
                                1 - d2 / MOUSE_RADIUS
                            );
                            opacity = 0.45 * factor;
                            color = `rgba(204, 171, 110, ${opacity})`;
                            lineWidth = 1 + factor * 2;
                        }

                        ctx.beginPath();
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[j].x, stars[j].y);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = lineWidth;
                        ctx.stroke();
                    }
                }
            }
        }

        // ПРОСТОЕ МЯГКОЕ СВЕЧЕНИЕ - без кружочков и лучей
        function drawMouseGlow(ctx) {
            if (mouseX < 0 || mouseY < 0) return;

            // Одно большое мягкое свечение
            const glow = ctx.createRadialGradient(
                mouseX, mouseY, 0,
                mouseX, mouseY, 200
            );
            glow.addColorStop(0, 'rgba(204, 171, 110, 0.12)');
            glow.addColorStop(0.4, 'rgba(204, 171, 110, 0.06)');
            glow.addColorStop(1, 'rgba(204, 171, 110, 0)');

            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 200, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();
        }

        function animate(time) {
            ctx.fillStyle = '#1B232A';
            ctx.fillRect(0, 0, width, height);

            // Рисуем мягкое свечение под мышью
            drawMouseGlow(ctx);

            for (const star of stars) {
                star.update(time);
                star.draw(ctx, time);
            }

            drawLines(ctx);

            requestAnimationFrame(animate);
        }

        // Обработка событий мыши
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseleave', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        // Обновление размера
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            for (const star of stars) {
                star.x = Math.random() * width;
                star.y = Math.random() * height;
            }
        });

        animate(0);
        console.log('✨ Мягкое свечение в цвете #ccab6e');
    </script>
</body>
</html>
