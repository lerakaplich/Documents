<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Прямоугольный край конверта -->
  <rect x="5" y="10" width="90" height="60" rx="0" fill="#ccab6e" stroke="#D9D9D6" stroke-width="2"/>

  <!-- Левая сторона конверта (клапан) -->
  <polyline points="5,10 50,45 95,10" fill="none" stroke="#D9D9D6" stroke-width="2"/>

  <!-- Нижняя часть клапана -->
  <line x1="5" y1="10" x2="50" y2="45" stroke="#D9D9D6" stroke-width="2"/>
  <line x1="50" y1="45" x2="95" y2="10" stroke="#D9D9D6" stroke-width="2"/>
</svg>